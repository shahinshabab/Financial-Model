name: Deploy Supabase migrations

# Runs when a new migration lands on main, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Not named SUPABASE_PROJECT_ID here: the CLI reads that variable itself.
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret for $v is not set (PROJECT_REF comes from SUPABASE_PROJECT_ID)"; exit 1; fi
          done
          # The project ref is the 20 lowercase letters in https://<ref>.supabase.co
          ref="$(echo "$PROJECT_REF" | tr -d '[:space:]')"
          if ! [[ "$ref" =~ ^[a-z]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID must be the 20-letter project ref (the xxxx in https://xxxx.supabase.co), not the project name, URL or UUID. Got ${#ref} characters."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$(echo "$PROJECT_REF" | tr -d '[:space:]')"

      - name: Show pending migrations
        run: supabase migration list

      - name: Apply migrations
        # --yes: CI has no terminal to answer the confirmation prompt
        run: supabase db push --yes
